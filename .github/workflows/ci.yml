name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, PowerShell 7
            os: ubuntu-latest
            shell: pwsh
          - name: Windows, PowerShell 7
            os: windows-latest
            shell: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        shell: ${{ matrix.shell }}
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Offline test suite
        shell: ${{ matrix.shell }}
        run: ./tests/Test-ADTD.ps1

  msi:
    name: Build MSI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install wixl
        run: sudo apt-get update && sudo apt-get install -y wixl
      - name: Build
        shell: pwsh
        run: ./setup/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ADTD_Modern_Setup
          path: dist/*.msi
