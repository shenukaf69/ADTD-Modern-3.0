name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, PowerShell 7
            os: ubuntu-latest
            exe: pwsh
          - name: Windows, PowerShell 7
            os: windows-latest
            exe: pwsh
          - name: Windows PowerShell 5.1
            os: windows-latest
            exe: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A step's shell can't come from the matrix, so start the right PowerShell directly.
      - name: Engine version
        run: ${{ matrix.exe }} -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); $PSVersionTable.PSEdition'
      - name: Offline test suite (also parses every script)
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File ./tests/Test-ADTD.ps1

  msi:
    name: Build MSI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install wixl
        run: sudo apt-get update && sudo apt-get install -y wixl
      - name: Build
        shell: pwsh
        run: ./setup/build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ADTD_Modern_Setup
          path: dist/*.msi
