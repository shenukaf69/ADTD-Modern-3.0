name: Release

# Publishes a GitHub Release with the MSI and the offline package:
# - automatically, when a new version reaches main (the ModuleVersion in src/ADTD.psd1 changes)
#   and there is no release for it yet; the tag v<version> is created on that commit
# - when a v* tag is pushed
# - or by hand from the Actions tab (Release > Run workflow), with a tag name
# The release notes come from that version's section in CHANGELOG.md.
on:
  push:
    branches: [main]
    paths: ['src/ADTD.psd1', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v3.0.2 (created if it doesn't exist)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Work out the version and skip if it is already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Import-PowerShellDataFile ./src/ADTD.psd1).ModuleVersion
          $tag = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } elseif ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$v" }
          gh release view $tag --repo ${{ github.repository }} *> $null
          $skip = ($LASTEXITCODE -eq 0)
          if ($skip) { Write-Host "Release $tag already exists; nothing to do." }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "skip=$($skip.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          exit 0
      - name: Install wixl
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y wixl
      - name: Test
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: ./tests/Test-ADTD.ps1
      - name: Build MSI and offline package
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./setup/build-msi.ps1
          ./setup/build-offline-package.ps1
      - name: Release notes from CHANGELOG.md
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = (Import-PowerShellDataFile ./src/ADTD.psd1).ModuleVersion
          $log = Get-Content -Raw ./CHANGELOG.md
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b.*?\r?\n(.*?)(?=^## |\z)")
          $notes = @(
            "**ADTD Modern $v** - Active Directory topology diagrams, security assessment and Microsoft Entra ID hybrid upgrade plan. By Shenuka Fernando.",
            '',
            '### Download',
            "- **ADTD_Modern_Setup_$v.msi**: installer (needs admin). Right-click, Properties, Unblock, then run it.",
            "- **ADTD-Modern-$v-offline.zip**: everything for computers without internet access. Start with START-HERE.txt.",
            '',
            "### What's new",
            $m.Groups[1].Value.Trim(),
            '',
            'Guides: [Install](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md) | [Offline](https://github.com/${{ github.repository }}/blob/main/docs/OFFLINE.md) | [Usage](https://github.com/${{ github.repository }}/blob/main/docs/USAGE.md)'
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ADTD Modern ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/ADTD_Modern_Setup_*.msi
            dist/ADTD-Modern-*-offline.zip
